<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小彰和小秀的恋爱小窝</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #e07a5f;
            --secondary-color: #f4f1de;
            --accent-color: #81b29a;
            --dark-color: #3d405b;
            --light-bg: #fdfcf7;
            --card-bg: #ffffff;
            --shadow: 0 10px 30px rgba(61, 64, 91, 0.08);
            --radius: 16px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--light-bg);
            color: var(--dark-color);
            line-height: 1.7;
            overflow-x: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(253, 252, 247, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 1px solid rgba(224, 122, 95, 0.1);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary-color);
            text-decoration: none;
        }

        .nav-links { display: flex; list-style: none; gap: 2rem; }

        .nav-links a { text-decoration: none; color: var(--dark-color); font-weight: 500; transition: color 0.3s; }

        .nav-links a:hover { color: var(--primary-color); }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1rem;
            background: linear-gradient(135deg, rgba(244,241,222,0.5) 0%, rgba(224,122,95,0.08) 100%);
        }

        .hero h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: var(--dark-color); margin-bottom: 1rem; }

        .hero h1 span { color: var(--primary-color); }

        .hero p { font-size: 1.2rem; color: #6c757d; margin-bottom: 2rem; }

        .counter-card {
            background: var(--card-bg);
            padding: 1.5rem 3rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }

        .time-box { text-align: center; }

        .time-box .number { font-size: 2rem; font-weight: 700; color: var(--primary-color); font-family: 'Playfair Display', serif; }

        .time-box .label { font-size: 0.85rem; color: #8d99ae; }

        .container { max-width: 1000px; margin: 5rem auto; padding: 0 2rem; }

        .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 3rem; color: var(--dark-color); }

        .section-title span { display: block; font-size: 1rem; font-family: 'Noto Sans SC', sans-serif; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }

        .timeline { position: relative; padding-left: 2rem; }

        .timeline::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 2px; background-color: rgba(224, 122, 95, 0.3); }

        .timeline-item { position: relative; margin-bottom: 3rem; background: var(--card-bg); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); }

        .timeline-item::before { content: ''; position: absolute; left: calc(-2rem - 6px); top: 1.5rem; width: 14px; height: 14px; border-radius: 50%; background-color: var(--primary-color); border: 3px solid var(--light-bg); }

        .timeline-date { font-size: 0.9rem; color: var(--primary-color); font-weight: 600; margin-bottom: 0.5rem; }

        .timeline-title { font-size: 1.3rem; margin-bottom: 0.8rem; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }

        .gallery-item { background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: transform 0.3s; }

        .gallery-item:hover { transform: translateY(-5px); }

        .gallery-img { width: 100%; height: 220px; object-fit: cover; background-color: #e9ecef; }

        .gallery-desc { padding: 1.2rem; font-size: 0.95rem; color: #6c757d; }

        footer { text-align: center; padding: 3rem 0; color: #8d99ae; font-size: 0.9rem; border-top: 1px solid rgba(0,0,0,0.05); margin-top: 5rem; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .counter-card { flex-wrap: wrap; justify-content: center; gap: 1rem; padding: 1.5rem; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo"><i class="fa-solid fa-heart"></i> 小彰和小秀</a>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#story">恋爱轨迹</a></li>
                <li><a href="#gallery">甜蜜回忆</a></li>
            </ul>
        </div>
    </header>

    <section id="home" class="hero">
        <h1>小彰 <span>&</span> 小秀</h1>
        <p>从相识那天起，世界都变得温柔了。</p>
        
        <div class="counter-card" id="counter">
            <div class="time-box">
                <div class="number" id="days">0</div>
                <div class="label">天</div>
            </div>
            <div class="time-box">
                <div class="number" id="hours">0</div>
                <div class="label">小时</div>
            </div>
            <div class="time-box">
                <div class="number" id="minutes">0</div>
                <div class="label">分钟</div>
            </div>
            <div class="time-box">
                <div class="number" id="seconds">0</div>
                <div class="label">秒</div>
            </div>
        </div>
    </section>

    <div class="container" id="story">
        <div class="section-title">
            <span>Milestones</span>
            我们的恋爱轨迹
        </div>
        
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-date">2026年05月27日</div>
                <div class="timeline-title">初次相遇</div>
                <p>那一天，我们在这个大世界里遇见了彼此，缘分就此开启。</p>
            </div>
            
            <div class="timeline-item">
                <div class="timeline-date">2026年07月30日</div>
                <div class="timeline-title">成为情侣</div>
                <p>我们决定坚定地走向对方，正式成为彼此生命中最重要的那个人。</p>
            </div>
        </div>
    </div>

    <div class="container" id="gallery">
        <div class="section-title">
            <span>Gallery</span>
            甜蜜记录
        </div>
        
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=600&q=80" alt="Memory" class="gallery-img">
                <div class="gallery-desc">我们相处的每一个瞬间都值得铭记。</div>
            </div>
        </div>
    </div>

    <footer>
        <p>Made with <i class="fa-solid fa-heart" style="color: var(--primary-color);"></i> by 小彰 & 小秀</p>
    </footer>

    <script>
        const startDate = new Date("2026-07-30T00:00:00"); 

        function updateTimer() {
            const now = new Date();
            const diff = now - startDate;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
